<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contato</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=DM+Mono:wght@500&family=DM+Sans:opsz,wght@9..40,400..700&display=swap">
<link rel="stylesheet" href="assets/styles.css?v=1">
</head>
<body data-pagina="contato">
<div id="topo"></div>
<main class="pagina gutter">
  <section class="secao-head">
    <span class="tag">Contato</span>
    <h1 id="c-titulo"></h1>
    <p class="lead" id="c-texto"></p>
  </section>
  <div class="contato-grade">
    <section class="cartao">
      <form id="f-contato" class="grade" novalidate>
        <div class="campo"><label for="nome">Seu nome</label><input id="nome" name="nome" autocomplete="name" required></div>
        <div class="campo"><label for="email">Seu e-mail</label><input id="email" name="email" type="email" autocomplete="email" required><span class="dica">A resposta chega aqui.</span></div>
        <div class="campo inteiro"><label for="assunto">Assunto</label><select id="assunto" name="assunto"></select></div>
        <div class="campo inteiro"><label for="mensagem">Mensagem</label><textarea id="mensagem" name="mensagem" required placeholder="Escreva sua mensagem…"></textarea></div>
        <div class="isca" aria-hidden="true"><label for="site">Não preencha</label><input id="site" name="site" tabindex="-1" autocomplete="off"></div>
        <div id="c-aviso" class="aviso inteiro" hidden role="status"></div>
        <div class="acoes inteiro"><button class="btn grande" id="c-enviar" type="submit">Enviar mensagem</button></div>
      </form>
    </section>
    <aside class="cartao">
      <header><span class="eyebrow">Outros canais</span><h2>Onde achar a gente</h2></header>
      <div class="info-lista" id="info"></div>
    </aside>
  </div>
</main>
<footer id="rodape"></footer>
<script src="config.js?v=1"></script>
<script src="conteudo.js?v=1"></script>
<script src="assets/api.js?v=1"></script>
<script src="assets/site.js?v=1"></script>
</body>
</html>
