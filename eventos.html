<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eventos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body data-pagina="eventos">
<div id="topo"></div>
<main class="pagina gutter">
  <section class="secao-head">
    <span class="tag">Agenda</span>
    <h1 id="p-titulo"></h1>
    <p class="lead" id="p-texto"></p>
  </section>
  <section class="secao" id="sec-proximos">
    <div class="secao-head"><span class="eyebrow">Próximos</span><h2>Vem aí</h2></div>
    <div class="cards" id="lista"></div>
  </section>
  <section class="secao" id="sec-passados" hidden>
    <div class="secao-head"><span class="eyebrow">Já rolou</span><h2>Eventos anteriores</h2></div>
    <div class="cards" id="passados"></div>
  </section>
</main>
<footer id="rodape"></footer>
<script src="config.js?v=8"></script>
<script src="conteudo.js?v=8"></script>
<script src="assets/api.js?v=8"></script>
